# Read the Docs configuration — https://greater-tables.readthedocs.io
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"          # matches requires-python

sphinx:
  configuration: docs/conf.py

formats:
  - pdf

# conf.py imports greater_tables for the version, and autodoc needs the real
# modules, so the package itself is installed alongside the docs extra.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
