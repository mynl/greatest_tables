[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greatest-tables"
dynamic = ["version"]
description = "Semantic table engine: DataFrame in, versioned table-document IR out, rendered to HTML, TikZ, text, or client-side JS."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Stephen Mildenhall" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "pytest>=8.0",
]

[tool.hatch.version]
path = "src/greatest_tables/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/greatest_tables"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# .pytest_cache is a junction to V:\dev\greatest-tables\.pytest_cache (dev
# drive, like .venv) — cache-dir creation fails on the NAS-synced repo path
