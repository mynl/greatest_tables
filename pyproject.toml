[build-system]
requires = ["hatchling>=1.27"]        # >=1.27: PEP 639 license expression support
build-backend = "hatchling.build"

[project]
name = "greater-tables"
dynamic = ["version"]
description = "Semantic table engine: DataFrame in, versioned table-document IR out, rendered to HTML, TikZ, text, or client-side JS."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stephen J Mildenhall", email = "mynl@me.com" }]
keywords = [
    "tables", "dataframe", "pandas", "html", "latex", "tikz", "quarto",
    "jupyter", "typography", "reporting",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/mynl/greatest_tables"
Documentation = "https://greater-tables-project.readthedocs.io/en/latest/"
"Source Code" = "https://github.com/mynl/greatest_tables"
Changelog = "https://greater-tables-project.readthedocs.io/en/latest/versions.html"
Issues = "https://github.com/mynl/greatest_tables/issues"

# Read the Docs installs the package plus this extra (see .readthedocs.yaml);
# day-to-day development uses the uv dependency group below.
[project.optional-dependencies]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "sphinx-copybutton>=0.5",
    "myst-parser>=4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "pyarrow>=25.0.0",
    "pytest>=8.0",
]

[tool.hatch.version]
path = "src/greater_tables/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/greater_tables"]

[tool.hatch.build.targets.sdist]
include = [
    "src", "tests", "schema", "js", "docs",
    "README.md", "CHANGELOG.md", "LICENSE", "package.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# .pytest_cache is a junction to V:\dev\greatest-tables\.pytest_cache (dev
# drive, like .venv) — cache-dir creation fails on the NAS-synced repo path
