[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greatest-tables"
version = "1.0.0"
description = "Semantic table engine: DataFrame in, versioned table-document IR out, rendered to HTML, TikZ, text, or client-side JS."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Stephen Mildenhall" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/greatest_tables"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# cache dir creation fails on the NAS-synced repo path; determinism > cache
addopts = "-p no:cacheprovider"
